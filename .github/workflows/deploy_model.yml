name: deploy-model

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. latest, or a commit SHA)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_DN }}
          password: ${{ secrets.DOCKERHUB_TOKEN_DN }}

      - name: Pull the requested image
        run: docker pull ${{ secrets.DOCKERHUB_DN }}/shoe-size-predictor:${{ inputs.image_tag }}

      - name: Stop and remove the old container (if running)
        run: docker rm -f shoe-size-predictor-app || true

      - name: Run the new container
        run: |
          docker run -d \
            --name shoe-size-predictor-app \
            -p 8080:8080 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_DN }}/shoe-size-predictor:${{ inputs.image_tag }}

      - name: Verify it's up
        run: |
          sleep 3
          curl -f http://localhost:8080/health